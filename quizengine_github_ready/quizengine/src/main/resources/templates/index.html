<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizEngine — Test Your Knowledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: rgba(255,255,255,0.07);
            --accent: #c8ff00;
            --accent2: #00d4ff;
            --text: #f0f0f5;
            --muted: #6b6b80;
            --card: #16161f;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            animation: floatBlob 8s ease-in-out infinite;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: rgba(200,255,0,0.06);
            top: -100px; left: -100px;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: rgba(0,212,255,0.05);
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200,255,0,0.08);
            border: 1px solid rgba(200,255,0,0.2);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 28px;
        }
        .badge::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(38px, 8vw, 52px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }
        h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,255,0,0.4), transparent);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .stat {
            background: var(--surface);
            padding: 16px 12px;
            text-align: center;
        }
        .stat-num {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
            letter-spacing: 0.05em;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .input-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }
        input[type="text"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: rgba(200,255,0,0.4);
            box-shadow: 0 0 0 3px rgba(200,255,0,0.08);
        }
        input[type="text"]::placeholder { color: var(--muted); }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #0a0a0f;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            border: none;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(200,255,0,0.25);
        }
        .btn:active { transform: translateY(0); }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="wrapper">
        <div class="badge">Quiz Engine v2.0</div>

        <h1>Test Your<br><span>Knowledge.</span></h1>
        <p class="subtitle">12 questions across General Knowledge and Technical domains. Prove your expertise and earn a certificate.</p>

        <div class="card">
            <div class="stats">
                <div class="stat">
                    <div class="stat-num">12</div>
                    <div class="stat-label">Questions</div>
                </div>
                <div class="stat">
                    <div class="stat-num">2</div>
                    <div class="stat-label">Sections</div>
                </div>
                <div class="stat">
                    <div class="stat-num">PDF</div>
                    <div class="stat-label">Certificate</div>
                </div>
            </div>

            <form action="/quiz" method="post">
                <label class="form-label">Your Full Name</label>
                <div class="input-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" name="name" placeholder="Enter your name" required autocomplete="off">
                </div>
                <button type="submit" class="btn">Begin Quiz →</button>
            </form>

            <p class="footer-note">Results are saved automatically to the database</p>
        </div>
    </div>
</body>
</html>
