<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎨 Color Palette App</h1>

  <input type="text" id="colorInput" placeholder="Enter color (e.g., red, #ff0000)" />

  <div class="button-group">
    <button onclick="changeBackground()">Background</button>
    <button onclick="changeText()">Text</button>
    <button onclick="resetStyles()">Reset</button>
  </div>

  <p id="displayText">Welcome to the Color Palette App</p>
</div>

<script src="script.js"></script>

</body>
</html>
