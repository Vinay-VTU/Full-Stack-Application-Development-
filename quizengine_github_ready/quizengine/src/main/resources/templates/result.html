<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Result — QuizEngine</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: rgba(255,255,255,0.07);
            --accent: #c8ff00;
            --accent2: #00d4ff;
            --fail: #ff4d6d;
            --text: #f0f0f5;
            --muted: #6b6b80;
            --card: #16161f;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200,255,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,255,0,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
        }
        .blob-1 { width: 600px; height: 600px; background: rgba(200,255,0,0.05); top: -200px; left: -200px; }
        .blob-2 { width: 500px; height: 500px; background: rgba(0,212,255,0.04); bottom: -200px; right: -200px; }

        .wrapper {
            width: 100%;
            max-width: 520px;
            animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 16px;
            text-align: center;
            margin-bottom: 32px;
            color: var(--muted);
        }
        .logo span { color: var(--accent); }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,255,0,0.5), transparent);
        }

        .card-top {
            padding: 40px 40px 32px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .emoji-wrap {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
            animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
        }
        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }

        .congrats {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .name-display {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 6px;
        }
        .name-display span { color: var(--accent); }
        .subtitle { font-size: 14px; color: var(--muted); }

        /* ── Score Section ── */
        .score-section {
            padding: 32px 40px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .score-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .score-num {
            font-family: 'Syne', sans-serif;
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: countUp 1s cubic-bezier(0.16,1,0.3,1) 0.5s both;
        }
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        .score-total {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--muted);
        }

        .score-bar-wrap {
            background: var(--surface);
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .score-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 100px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.16,1,0.3,1);
        }

        /* ── PASS / FAIL Badge ── */
        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            padding: 10px 28px;
            border-radius: 100px;
            margin-bottom: 16px;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.8s both;
        }
        .result-badge.pass {
            background: rgba(200,255,0,0.1);
            border: 1px solid rgba(200,255,0,0.4);
            color: var(--accent);
        }
        .result-badge.fail {
            background: rgba(255,77,109,0.1);
            border: 1px solid rgba(255,77,109,0.4);
            color: var(--fail);
        }

        /* ── Marks breakdown row ── */
        .marks-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .mark-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .mark-box-num {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
        }
        .mark-box-num.correct { color: var(--accent); }
        .mark-box-num.wrong { color: var(--fail); }
        .mark-box-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: 0.05em;
        }

        .dynamic-message {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ── Actions ── */
        .actions {
            padding: 28px 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            display: block;
            text-align: center;
            background: var(--accent);
            color: #0a0a0f;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(200,255,0,0.25);
        }

        .btn-secondary {
            display: block;
            text-align: center;
            background: transparent;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            transition: border-color 0.2s, background 0.2s;
        }
        .btn-secondary:hover {
            border-color: rgba(200,255,0,0.3);
            background: rgba(200,255,0,0.04);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="wrapper">
        <div class="logo">Quiz<span>Engine</span></div>

        <div class="result-card">

            <!-- Top Header -->
            <div class="card-top">
                <span class="emoji-wrap" th:text="${passed} ? '🏆' : '📚'">🎯</span>
                <div class="congrats">Quiz Completed</div>
                <div class="name-display">
                    <span th:text="${passed} ? 'Well done, ' : 'Keep going, '">Well done, </span>
                    <span th:text="${name}">User</span>!
                </div>
                <div class="subtitle" th:text="${passed} ? 'You passed the quiz today!' : 'You did not pass this time. Try again!'">
                    Here is how you performed today
                </div>
            </div>

            <!-- Score Section -->
            <div class="score-section">
                <div class="score-label">Your Final Score</div>

                <div class="score-display">
                    <span class="score-num" th:text="${score}">0</span>
                    <span class="score-total">/ 12</span>
                </div>

                <div class="score-bar-wrap">
                    <div class="score-bar" id="scoreBar"></div>
                </div>

                <!-- PASS / FAIL Badge -->
                <div th:if="${passed}" class="result-badge pass">
                    ✓ PASS — <span th:text="${score}"></span> / 12 Correct
                </div>
                <div th:if="${!passed}" class="result-badge fail">
                    ✗ FAIL — Need 6 or more to pass
                </div>

                <!-- Marks Breakdown -->
                <div class="marks-row">
                    <div class="mark-box">
                        <div class="mark-box-num correct" th:text="${score}">0</div>
                        <div class="mark-box-label">✓ Correct Answers</div>
                    </div>
                    <div class="mark-box">
                        <div class="mark-box-num wrong" th:text="${12 - score}">0</div>
                        <div class="mark-box-label">✗ Wrong Answers</div>
                    </div>
                </div>

                <!-- Dynamic Message -->
                <div class="dynamic-message" th:text="${message}">Keep pushing!</div>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <a th:if="${passed}"
                   th:href="@{/generate-certificate(name=${name},score=${score})}"
                   class="btn-primary">
                    🎓 Download Certificate
                </a>
                <a href="/" class="btn-secondary">↩ Take Quiz Again</a>
            </div>

        </div>

        <div class="footer">© 2026 QuizEngine · Results saved to database</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const score = parseInt(document.querySelector('.score-num')?.textContent || '0');
            setTimeout(() => {
                document.getElementById('scoreBar').style.width = (score / 12 * 100) + '%';
            }, 300);
        });
    </script>
</body>
</html>
